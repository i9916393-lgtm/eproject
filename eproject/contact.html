<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | FotoLab</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="contact.css">
</head>

<body>

<section class="contactform">
  <div class="container">
    <div class="row justify-content-center">

      <div class="col-lg-8 col-md-10">
        <div class="card contact-card shadow-lg border-0 rounded-4">

          <div class="card-body p-4 p-md-5">

            <h2 class="text-center fw-bold mb-3">Contact Us</h2>
            <p class="text-center text-muted mb-4">
              Have questions? Fill out the form and we’ll get back to you.
            </p>

            <!-- GEO LOCATION INFO -->
            <p class="text-center location-text">
              📍 Your Location: <span id="location">Detecting...</span>
            </p>

            <form id="contactForm">
              <div class="row g-3">

                <div class="col-md-6">
                  <label class="form-label">Full Name</label>
                  <input type="text" class="form-control" required>
                </div>

                <div class="col-md-6">
                  <label class="form-label">Email Address</label>
                  <input type="email" class="form-control" required>
                </div>

                <div class="col-md-6">
                  <label class="form-label">Phone Number</label>
                  <input type="tel" class="form-control">
                </div>

                <div class="col-md-6">
                  <label class="form-label">Subject</label>
                  <input type="text" class="form-control">
                </div>

                <div class="col-12">
                  <label class="form-label">Message</label>
                  <textarea class="form-control" rows="4" required></textarea>
                </div>

                <div class="col-12 text-center">
                  <button type="submit" class="btn btn-primary px-5">
                    Send Message
                  </button>
                </div>

              </div>
            </form>

          </div>

        </div>
      </div>

    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="contact.js"></script>
<script>/* ================= CONTACT FORM SUBMIT ================= */
document.getElementById("contactForm").addEventListener("submit", function (e) {
  e.preventDefault();

  alert("✅ Thank you! Your message has been sent successfully.");
  this.reset();
});

/* ================= GEO LOCATION ================= */
const locationText = document.getElementById("location");

if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    position => {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`)
        .then(res => res.json())
        .then(data => {
          const city = data.address.city || data.address.town || data.address.village || "Unknown city";
          const country = data.address.country || "Unknown country";
          locationText.textContent = `${city}, ${country}`;
        })
        .catch(() => {
          locationText.textContent = "Location unavailable";
        });
    },
    () => {
      locationText.textContent = "Location permission denied";
    }
  );
} else {
  locationText.textContent = "Geolocation not supported";
}
</script>
</body>
</html>
